services:

  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:80"
    networks:
      - shop-platform-network

  gateway-api:
    image: shop-platform/gateway-api:latest
    container_name: gateway-api
    build:
      context: ../
      dockerfile: src/gateway/Gateway.Api/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - auth-api
      - order-api
    networks:
      - shop-platform-network

  smoke-test-ui:
    image: shop-platform/smoke-test-ui:latest
    container_name: smoke-test-ui
    build:
      context: ../src/frontend/smoke-test-ui
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - gateway-api
    networks:
      - shop-platform-network

  aero-smoke-test-ui:
    image: shop-platform/aero-smoke-test-ui:latest
    container_name: aero-smoke-test-ui
    build:
      context: ../src/frontend/aero-smoke-test-ui
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    depends_on:
      - gateway-api
    networks:
      - shop-platform-network

  auth-db:
    image: postgres:17-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: AuthDb
    ports:
      - "5436:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shop-platform-network

  auth-api:
    image: shop-platform/auth-api:latest
    container_name: auth-api
    build:
      context: ../
      dockerfile: src/services/auth/Auth.Api/Dockerfile
    ports:
      - "5050:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=auth-db;Port=5432;Database=AuthDb;Username=postgres;Password=postgres;
      - Jwt__Secret=${JWT_SECRET:-development-secret-change-before-production-32-chars}
      - Jwt__Issuer=shop-platform
      - Jwt__Audience=shop-platform
      - Jwt__ExpiresDays=7
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - shop-platform-network

  catalog-db:
    image: postgres:17-alpine
    container_name: catalog-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: CatalogDb
    ports:
      - "5434:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shop-platform-network

  catalog-api:
    image: shop-platform/catalog-api:latest
    container_name: catalog-api
    build:
      context: ../
      dockerfile: src/services/catalog/Catalog.Api/Dockerfile
    ports:
      - "5256:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=catalog-db;Port=5432;Database=CatalogDb;Username=postgres;Password=postgres;
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - shop-platform-network

  cart-db:
    image: postgres:17-alpine
    container_name: cart-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: CartDb
    ports:
      - "5433:5432"
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shop-platform-network

  cart-api:
    image: shop-platform/cart-api:latest
    container_name: cart-api
    build:
      context: ../
      dockerfile: src/services/cart/Cart.Api/Dockerfile
    ports:
      - "5082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=cart-db;Port=5432;Database=CartDb;Username=postgres;Password=postgres;
    depends_on:
      cart-db:
        condition: service_healthy
    networks:
      - shop-platform-network

  order-db:
    image: postgres:17-alpine
    container_name: order-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: OrderDb
    ports:
      - "5435:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - shop-platform-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  order-api:
    image: shop-platform/order-api:latest
    container_name: order-api
    build:
      context: ../
      dockerfile: src/services/order/Order.Api/Dockerfile
    ports:
      - "5080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Logging__SeqUrl=http://seq:80
      - RabbitMq__Host=rabbitmq
      - GrpcClients__ModerationUrl=http://moderation-api:8080
      - GrpcClients__CartUrl=http://cart-api:8080
      - GrpcClients__PaymentUrl=http://payment-api:8080
    depends_on:
      order-db:
        condition: service_started
      moderation-api:
        condition: service_started
      payment-api:
        condition: service_started
      cart-api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - shop-platform-network

  moderation-api:
    image: shop-platform/moderation-api:latest
    container_name: moderation-api
    build:
      context: ../
      dockerfile: src/services/moderation/Moderation.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Logging__SeqUrl=http://seq:80
    ports:
      - "5081:8080"
    depends_on:
      - seq
    networks:
      - shop-platform-network

  payment-db:
    image: postgres:17-alpine
    container_name: payment-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: PaymentDb
    ports:
      - "5437:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shop-platform-network

  payment-api:
    image: shop-platform/payment-api:latest
    container_name: payment-api
    build:
      context: ../
      dockerfile: src/services/payment/Payment.Api/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=payment-db;Port=5432;Database=PaymentDb;Username=postgres;Password=postgres;
      - Consul__Host=http://consul:8500
      - Consul__ServiceName=payment-service
      - Consul__ServiceId=payment-service-1
      - Consul__ServiceHost=payment-api
      - Consul__ServicePort=8080
    depends_on:
      payment-db:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - shop-platform-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # UI (guest/guest)
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shop-platform-network

  notification-worker:
    image: shop-platform/notification-worker:latest
    container_name: notification-worker
    build:
      context: ../
      dockerfile: src/services/notification/Notification.Worker/Dockerfile
    environment:
      - RabbitMq__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - shop-platform-network

  consul:
    image: hashicorp/consul:1.18
    container_name: consul
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0 -ui
    healthcheck:
      test: [ "CMD", "consul", "members" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shop-platform-network

volumes:
  auth-db-data:
  order-db-data:
  catalog-db-data:
  cart-db-data:
  payment-db-data:

networks:
  shop-platform-network:
    driver: bridge
